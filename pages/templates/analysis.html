{% extends "base.html" %}

{% block title %}Analysis{% endblock %}

{% block content %}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- DATA -->
<script id="chart-data" type="application/json">
{
    "models": {{ stats.models | tojson }},
    "accuracy": {{ stats.accuracy | tojson }},
    "matrices": {{ stats.matrices | tojson }},
    "total": {{ stats.total }}
}
</script>

<div class="card">
    <h2>📊 Model Analysis</h2>

    <!-- Batch -->
    <div style="margin-bottom: 20px;">
        <h4>⚡ Batch Evaluate</h4>
        <a href="/evaluate_batch?size=5"><button>Run 5</button></a>
        <a href="/evaluate_batch?size=10"><button>Run 10</button></a>
        <a href="/evaluate_batch?size=50"><button>Run 50</button></a>
        <a href="/evaluate_batch?size=100"><button>Run 100</button></a>
    </div>

    <p><b>Total Evaluated:</b> {{ stats.total }}</p>

    <hr>

    <!-- Accuracy -->
    <h3>🧠 Accuracy (All Models)</h3>
    <canvas id="accuracyChart"></canvas>

    <hr>

    <!-- Dynamic Model Sections -->
    <div id="modelSections"></div>

</div>

<script>
const data = JSON.parse(document.getElementById('chart-data').textContent);

/* ✅ CORRECT LABELS */
const labels = ['hate speech', 'offensive language', 'neither'];


/* ===== Accuracy Chart ===== */
new Chart(document.getElementById('accuracyChart'), {
    type: 'bar',
    data: {
        labels: data.models,
        datasets: [{
            label: 'Accuracy',
            data: data.models.map(m => data.accuracy[m] || 0),
        }]
    },
    options: {
        scales: {
            y: { beginAtZero: true, max: 1 }
        }
    }
});


/* ===== Distribution Helper ===== */
function getDistribution(matrix) {
    let actual = {
        "hate speech": 0,
        "offensive language": 0,
        "neither": 0
    };

    let predicted = {
        "hate speech": 0,
        "offensive language": 0,
        "neither": 0
    };

    labels.forEach(t => {
        labels.forEach(p => {
            const val = (matrix[t] && matrix[t][p]) || 0;
            actual[t] += val;
            predicted[p] += val;
        });
    });

    return {actual, predicted};
}


/* ===== Dynamic Model Sections ===== */
const container = document.getElementById('modelSections');

data.models.forEach(model => {

    const matrix = data.matrices[model];

    if (!matrix) return;

    const safeId = model.replace(/[^a-zA-Z0-9]/g, "");

    const section = document.createElement('div');
    section.innerHTML = `
        <hr>
        <h3>📦 ${model}</h3>
        <canvas id="${safeId}-dist"></canvas>
        <canvas id="${safeId}-heat"></canvas>
    `;

    container.appendChild(section);

    /* ===== Distribution ===== */
    const dist = getDistribution(matrix);

    new Chart(document.getElementById(`${safeId}-dist`), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'Actual',
                    data: labels.map(l => dist.actual[l])
                },
                {
                    label: 'Predicted',
                    data: labels.map(l => dist.predicted[l])
                }
            ]
        }
    });

    /* ===== Heatmap ===== */
    drawHeatmap(`${safeId}-heat`, matrix, `${model} Confusion Matrix`);
});


/* ===== Heatmap Renderer ===== */
function drawHeatmap(canvasId, matrix, title) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;

    const ctx = canvas.getContext('2d');

    const size = labels.length;
    const cellSize = 80;
    const padLeft = 140;
    const padTop = 60;

    canvas.width = padLeft + cellSize * size;
    canvas.height = padTop + cellSize * size + 40;

    ctx.font = '16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(title, canvas.width / 2, 25);

    for (let i = 0; i < size; i++) {
        for (let j = 0; j < size; j++) {

            const val = (matrix[labels[i]] && matrix[labels[i]][labels[j]]) || 0;
            const intensity = Math.min(val / 5, 1);

            ctx.fillStyle = `rgba(33, 150, 243, ${intensity})`;
            ctx.fillRect(
                padLeft + j * cellSize,
                padTop + i * cellSize,
                cellSize,
                cellSize
            );

            ctx.fillStyle = 'black';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.fillText(
                val,
                padLeft + j * cellSize + cellSize / 2,
                padTop + i * cellSize + cellSize / 2
            );
        }
    }

    /* X labels */
    ctx.textAlign = 'center';
    labels.forEach((l, j) => {
        ctx.fillText(
            l,
            padLeft + j * cellSize + cellSize / 2,
            padTop + size * cellSize + 20
        );
    });

    /* Y labels */
    ctx.textAlign = 'right';
    labels.forEach((l, i) => {
        ctx.fillText(
            l,
            padLeft - 10,
            padTop + i * cellSize + cellSize / 2
        );
    });
}
</script>

{% endblock %}
