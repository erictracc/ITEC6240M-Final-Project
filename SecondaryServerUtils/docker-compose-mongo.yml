version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-lm
    restart: unless-stopped

    ports:
      - "11434:11434"  # Ollama API exposed on this port

    volumes:
      - ollama_data:/root/.ollama  # Stores downloaded models (persistent)

    environment:
      - OLLAMA_KEEP_ALIVE=24h

    # -----------------------------------------
    # AFTER STARTING THE CONTAINER:
    #
    # 1. Enter the container:
    #    docker exec -it ollama-lm bash
    #
    # 2. Install models used in this project:
    #    ollama pull llama3.1
    #    ollama pull phi3
    #
    # 3. Verify installation:
    #    ollama list
    #
    # These models are used for hate speech classification
    # in the Flask application.
    # -----------------------------------------

volumes:
  ollama_data: